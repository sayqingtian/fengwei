name: Clean expired audit logs
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fengwei-audit-retention
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'sayqingtian/fengwei'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/clean-audit.mjs
